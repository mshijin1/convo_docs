version: '3.8'

services:
  # 1. Message Queue & Tracking Layer (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 2. Metadata Database Layer (MongoDB)
  mongodb:
    image: mongo:6.0
    container_name: rag_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo_data:/data/db
    restart: always

  # 3. NEW: HUGGING FACE EMBEDDING SERVER 
  embedding-server:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: rag_embedding_server
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data
    command: --model-id BAAI/bge-base-en-v1.5
    restart: always

  # 4. Vector Database Layer (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API (This is what qdrant-client connects to)
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  redis_data:
  mongo_data:
  tei_data:
  qdrant_data: